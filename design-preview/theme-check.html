<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>theme-check｜A2 地基元件驗證頁</title>
<!-- 驗證頁：直接載入真正的 ../src/theme.jsx，用其中的 A2 元件砌成，不複製樣板 CSS。
     載入方式與 app 的 index.html 相同（CDN 的 React / Babel / Tailwind）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Baloo+2:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{box-sizing:border-box}
  html{background:#ECE8FB}
  body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" src="../src/theme.jsx"></script>
<script type="text/babel">
  const { A2, A2Card, A2Button, A2BackButton, A2ModuleIcon, A2Background, MODULE_ICONS, A2_MIN_FONT_PX } = window.App.UI;
  const NAMES = {
    poetry: "詩詞學習", essay: "作文金句", cangjie: "倉頡輸入法", mandarin: "普通話練習", idiom: "成語學習",
    history: "中國歷史故事", reading: "閱讀理解", rhetoric: "修辭手法", punctuation: "標點符號", classicalProse: "文言文選讀",
  };
  const TOKEN_GROUPS = [
    ["文字與強調色", ["ink", "sub", "acc", "accD", "accShadow"]],
    ["卡片", ["glass", "glassBd"]],
    ["頂部色帶與等級卡", ["band", "lvBg", "stampBg", "sealBg"]],
    ["任務列與標籤", ["row", "rowDone", "ok", "hot", "fireBg", "shieldBg", "todayBg", "segTrack", "barTrack"]],
    ["導航列", ["dock", "dockOn", "dockInk"]],
  ];

  function Check() {
    const [blobs, setBlobs] = React.useState(true);
    const [presses, setPresses] = React.useState(0);
    const h2 = { fontSize: 20, fontWeight: 900, lineHeight: 1.3, margin: 0 };
    const p = { fontSize: 15, lineHeight: 1.6, margin: "6px 0 0", color: A2.sub };
    return (
      <div style={{ fontFamily: A2.font, color: A2.ink, minHeight: "100vh", position: "relative" }}>
        <A2Background blobs={blobs} />
        <main style={{ position: "relative", zIndex: 1, maxWidth: 760, margin: "0 auto", padding: "20px 20px 56px", display: "grid", gap: 16 }}>
          <div>
            <A2BackButton label="← 樣板列表" onClick={() => { window.location.href = "./index.html"; }} />
          </div>

          <A2Card className="chk-card">
            <h1 style={{ fontSize: 26, fontWeight: 900, lineHeight: 1.25, margin: 0 }}>A2 地基元件驗證頁</h1>
            <p style={p}>本頁用真正的 src/theme.jsx 元件砌成，用來核對 6a 新增的色彩、字體和元件；真正的畫面尚未套用任何 A2 元件。</p>
          </A2Card>

          <A2Card className="chk-card" style={{ display: "grid", gap: 14 }}>
            <h2 style={h2}>A2Button／A2BackButton</h2>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
              <A2Button className="chk-btn" onClick={() => setPresses((n) => n + 1)}>主按鈕（按下會下沉）</A2Button>
              <A2Button className="chk-btn" disabled>停用狀態</A2Button>
              <A2BackButton className="chk-back" onClick={() => setPresses((n) => n + 1)} />
              <A2BackButton className="chk-back" label="← 返回主頁" onClick={() => setPresses((n) => n + 1)} />
            </div>
            <p style={{ ...p, margin: 0 }}>已按下 {presses} 次。主按鈕與返回掣最小高度 48px，返回掣最小闊度 96px，字體 16px 粗體。</p>
          </A2Card>

          <A2Card className="chk-card" style={{ display: "grid", gap: 14 }}>
            <h2 style={h2}>A2ModuleIcon（10 個模組）</h2>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 12 }}>
              {Object.keys(NAMES).map((k) => (
                <div key={k} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <A2ModuleIcon moduleKey={k} className="chk-ico" />
                  <span style={{ fontSize: 15, fontWeight: 700, lineHeight: 1.3 }}>{NAMES[k]}</span>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
              <A2ModuleIcon moduleKey="poetry" size={36} className="chk-ico-s" />
              <A2ModuleIcon moduleKey="idiom" size={54} />
              <A2ModuleIcon moduleKey="history" size={72} className="chk-ico-l" />
              <A2ModuleIcon moduleKey="unknown-key" size={54} className="chk-ico-fb" />
              <span style={{ fontSize: 14, color: A2.sub }}>36／54／72 px，最後一個為未知 key 的後備圖示</span>
            </div>
          </A2Card>

          <A2Card className="chk-card" style={{ display: "grid", gap: 12 }}>
            <h2 style={h2}>A2Background</h2>
            <p style={{ ...p, margin: 0 }}>本頁背景就是 A2Background（漸層加三個模糊色團）。樣板 style-a2.html 本身把色團隱藏了，所以可以用下面的開關對照。</p>
            <div>
              <A2Button className="chk-toggle" onClick={() => setBlobs((b) => !b)}>{blobs ? "隱藏色團（等同樣板）" : "顯示色團"}</A2Button>
            </div>
          </A2Card>

          <A2Card className="chk-card" style={{ display: "grid", gap: 14 }}>
            <h2 style={h2}>A2 色彩 token（節錄）</h2>
            {TOKEN_GROUPS.map(([title, keys]) => (
              <div key={title}>
                <p style={{ fontSize: 14, fontWeight: 900, margin: "0 0 8px" }}>{title}</p>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))", gap: 8 }}>
                  {keys.map((k) => (
                    <div key={k} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span aria-hidden="true" style={{ width: 28, height: 28, borderRadius: 8, flex: "none", border: `1px solid ${A2.glassBd}`, background: A2[k] }} />
                      <span style={{ fontSize: 13, lineHeight: 1.3, wordBreak: "break-all" }}><b>{k}</b></span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </A2Card>
        </main>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Check />);
</script>
</body>
</html>
